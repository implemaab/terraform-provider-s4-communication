# GoReleaser configuration, see https://goreleaser.com. The release workflow
# runs it when a "v*" tag is pushed.
version: 2

# The Terraform Registry expects the binary and archives to be named after
# the provider type, terraform-provider-s4communication, not after the
# repository.
project_name: terraform-provider-s4communication

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # goreleaser does not work with CGO, and CGO would complicate usage in
      # CI/CD systems like Terraform Cloud where users cannot install libraries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # The batch flag tells GPG that this is not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set by the release workflow
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # To examine a release before it goes live, uncomment this line:
  # draft: true

changelog:
  use: github-native
